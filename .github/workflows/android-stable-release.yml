name: Publish Stable Signed Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hardware-inspector-stable-release
  cancel-in-progress: false
jobs:
  sign-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Load private keystore from repository secrets; enforce pinned certificate
        env:
          HIP_KEYSTORE_B64: ${{ secrets.HIP_KEYSTORE_B64 }}
          HIP_KEYSTORE_PASSWORD: ${{ secrets.HIP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$HIP_KEYSTORE_B64" ] || [ -z "$HIP_KEYSTORE_PASSWORD" ]; then
            echo "::error::Set BOTH HIP_KEYSTORE_B64 and HIP_KEYSTORE_PASSWORD in repository Actions secrets before publishing a release."
            exit 1
          fi
          umask 077
          STORE="$RUNNER_TEMP/hardware-inspector-prod.p12"
          printf '%s' "$HIP_KEYSTORE_B64" | base64 --decode > "$STORE"
          test -s "$STORE"
          keytool -exportcert -alias hardware-inspector-prod \
            -keystore "$STORE" -storetype PKCS12 \
            -storepass "$HIP_KEYSTORE_PASSWORD" \
            -file "$RUNNER_TEMP/hardware-inspector-public.cer" >/dev/null
          EXPECTED=$(tr -d '[:space:]' < app/signing-certificate.sha256)
          ACTUAL=$(sha256sum "$RUNNER_TEMP/hardware-inspector-public.cer" | awk '{print toupper($1)}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate does not match the permanent pinned certificate. Do not rotate keys accidentally."
            exit 1
          fi
          echo "HIP_KEYSTORE_PATH=$STORE" >> "$GITHUB_ENV"
          echo "EXPECTED_CERT_SHA256=$EXPECTED" >> "$GITHUB_ENV"

      - name: Compile permanently signed APK
        env:
          HIP_KEYSTORE_PASSWORD: ${{ secrets.HIP_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify installed-upgrade signing identity and APK validity
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-verify.txt"
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/apk-verify.txt"
          ACTUAL=$(grep -m1 "Signer #1 certificate SHA-256 digest:" "$RUNNER_TEMP/apk-verify.txt" \
            | sed 's/.*digest: //' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK certificate mismatch. Publishing blocked."
            exit 1
          fi
          echo "Verified permanent certificate: $EXPECTED_CERT_SHA256"

      - name: Create permanent GitHub Release (not a debug artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n -E 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          TAG="v$VERSION"
          ASSET="HardwareInspectorPro-$TAG.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump versionCode and versionName; never replace an existing published version."
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
            --target "$GITHUB_SHA" \
            --title "Hardware Inspector Pro $TAG — stable signed APK" \
            --notes "Permanently signed APK. Certificate SHA-256: $EXPECTED_CERT_SHA256. The FIRST switch from earlier randomly signed debug APKs requires backing up the JSON report, uninstalling the old app, and restoring counters after installation. Future versions signed with this same certificate can update in place without deleting monitoring data." \
            --latest
