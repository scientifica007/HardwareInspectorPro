name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile native Android app
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HardwareInspectorPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish versioned debug APK to Releases (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n -E 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          TAG="v$VERSION"
          RELEASE_FILE="HardwareInspectorPro-$TAG-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_FILE"
          sha256sum "$RELEASE_FILE" > "$RELEASE_FILE.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists: skip (releases are immutable per version)"
          else
            gh release create "$TAG" "$RELEASE_FILE" "$RELEASE_FILE.sha256" \
              --title "Hardware Inspector Pro $TAG (test APK)" \
              --notes "Experimental native Android APK for OPPO A12 (Android 9) and compatible phones. Manual first-use date entry removed. Compass, gyro and read-only eMMC wear checks included. This is a DEBUG-signed APK, not a production distribution. Android may require uninstalling older debug builds due to signing-key differences; export reports first. No root needed. Wear counters may be unavailable because of OEM restrictions." \
              --prerelease --target "$GITHUB_SHA"
          fi
