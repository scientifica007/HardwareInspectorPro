name: Validate Android Sources and Signing Configuration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug sources (not an updateable distribution APK)
        run: gradle --no-daemon :app:assembleDebug
      - name: Exercise release signing with an ephemeral CI-only key
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ci-only.p12" \
            -storetype PKCS12 -storepass "CI_ONLY_KEY_NOT_FOR_DISTRIBUTION_2026" \
            -keypass "CI_ONLY_KEY_NOT_FOR_DISTRIBUTION_2026" \
            -alias hardware-inspector-prod -keyalg RSA -keysize 2048 \
            -validity 2 -dname "CN=CI temporary, O=Not for distribution"
          HIP_KEYSTORE_PATH="$RUNNER_TEMP/ci-only.p12" \
            HIP_KEYSTORE_PASSWORD="CI_ONLY_KEY_NOT_FOR_DISTRIBUTION_2026" \
            gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk
      # Deliberately no APK artifact here. This job uses an ephemeral debug
      # or test key and must not be used for app updates.
